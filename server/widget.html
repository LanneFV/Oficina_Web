<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>VLibras</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #EEF2FF; }
      [vw] {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        right: 0 !important; bottom: 0 !important;
        transform: none !important;
        width: 100% !important; height: 100% !important;
      }
      [vw-access-button] { display: none !important; }
      [vw] [vw-plugin-wrapper] {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        width: 100% !important; height: 100% !important;
        float: none !important; border-radius: 0 !important;
        background: transparent !important;
      }
      [vp] .vpw-box, [vp] .vpw-controls { border-radius: 0 !important; }

      /* Hide VLibras chrome — selectors from actual injected DOM */
      .vpw-mes,
      [settings-btn],
      .vw-plugin-top-wrapper,
      .vpw-settings-btn-wrapper,
      [vp-rate-box],
      [vp-main-guide-screen],
      [vp-message-box],
      [vp-settings-btn],
      [vp-suggestion-button],
      [vp-info-screen],
      [vp-settings],
      [vp-dictionary],
      [vp-suggestion-screen],
      [vp-translator-screen],
      [vp-more-options-screen],
      [vp-emotions-tooltip] { display: none !important; }
      #vlibras-target {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: transparent; pointer-events: all;
        user-select: text; font-size: 18px;
        display: none;
      }
    </style>
  </head>
  <body>
    <span id="vlibras-target"> </span>
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget("https://vlibras.gov.br/app");
      function tryClick() {
        const btn = document.querySelector("[vw-access-button]");
        if (btn) btn.click();
        else setTimeout(tryClick, 200);
      }
      setTimeout(tryClick, 500);

      const _HIDE_SELECTORS = [
        '.vpw-mes', '[settings-btn]', '.vw-plugin-top-wrapper', '.vpw-settings-btn-wrapper',
        '[vp-rate-box]', '[vp-main-guide-screen]', '[vp-message-box]',
        '[vp-settings-btn]', '[vp-suggestion-button]', '[vp-info-screen]',
        '[vp-settings]', '[vp-dictionary]', '[vp-suggestion-screen]',
        '[vp-translator-screen]', '[vp-more-options-screen]', '[vp-emotions-tooltip]',
        '[vp-change-avatar]', '[vp-aux-controls]',
      ].join(',');

      function hideSidebar() {
        document.querySelectorAll(_HIDE_SELECTORS).forEach(el => {
          el.style.setProperty('display', 'none', 'important');
        });
        // Override VLibras's @media width: 210px !important via inline style (beats any stylesheet rule)
        const wrapper = document.querySelector('[vw-plugin-wrapper]');
        if (wrapper) {
          wrapper.style.setProperty('width', '100%', 'important');
          wrapper.style.setProperty('height', '100%', 'important');
          wrapper.style.setProperty('max-width', 'none', 'important');
          wrapper.style.setProperty('min-height', '0', 'important');
          wrapper.style.setProperty('background', 'transparent', 'important');
        }
      }

      // Runs a few times while VLibras loads, then watches for late-injected elements
      [500, 1500, 3000, 5000].forEach(t => setTimeout(hideSidebar, t));
      const _uiHider = new MutationObserver(hideSidebar);
      _uiHider.observe(document.body, { childList: true, subtree: true });
      setTimeout(() => _uiHider.disconnect(), 12000);
    </script>

    <script>
      // Widget owns the queue — it is the only one that knows when an animation finishes.
      const ws = new WebSocket("ws://localhost:8766");
      const queue = [];

      function isAnimating() {
        const controls = document.querySelector("[vp-controls]");
        if (!controls) return false;
        return !controls.classList.contains("vpw-stopped");
      }

      function processQueue() {
        if (queue.length === 0 || isAnimating()) return;
        window.parent.postMessage({ type: 'ANIMACAO_FIM' }, '*');
        const text = queue.shift();
        const el = document.getElementById("vlibras-target");
        el.textContent = text;
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
        window.parent.postMessage({ type: 'TRADUZINDO', text }, '*');
      }

      setInterval(() => {
        if (!isAnimating() && queue.length > 0) processQueue();
      }, 1000);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (!data.text) return;
        queue.push(data.text);
        processQueue();
      };
    </script>
  </body>
</html>
